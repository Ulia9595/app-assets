<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Недействительный токен | Game Auth</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="page-container">
        <div class="card-custom card-error">

            <div class="header header-error">
                <div class="header-icon error">
                    <i class="fas fa-exclamation-triangle text-white"></i>
                </div>
                <h1 class="h3 mb-0 fw-bold">Ошибка токена</h1>
            </div>

            <div class="body">
                <h2 class="title-error">Недействительный токен</h2>

                <p class="message">Токен сброса пароля недействителен, просрочен или уже использован</p>

                <div class="info-box error">
                    <h6>Возможные причины:</h6>

                    <div class="tip-item">
                        <div class="tip-icon error">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="tip-text">
                            Срок действия ссылки истёк (15 минут)
                        </div>
                    </div>

                    <div class="tip-item">
                        <div class="tip-icon error">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="tip-text">
                            Токен уже использован для сброса пароля
                        </div>
                    </div>

                    <div class="tip-item">
                        <div class="tip-icon error">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="tip-text">
                            Неверная или повреждённая ссылка
                        </div>
                    </div>
                </div>

                <div id="extra-error"></div>

                <div class="mt-4 small info-note-error">
                    <div class="d-flex align-items-center justify-content-center">
                        <i class="fas fa-info-circle me-2"></i>
                        <span>Токены безопасности действительны в течение 15 минут</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('message');

        if (errorMessage) {
            const block = document.createElement('div');
            block.className = 'alert alert-light border mt-3';

            block.innerHTML = `
                <div class="d-flex align-items-center">
                    <i class="fas fa-exclamation-circle text-warning me-2"></i>
                    <div>
                        <strong>Подробности:</strong>
                        <div class="small mt-1">${decodeURIComponent(errorMessage)}</div>
                    </div>
                </div>
            `;

            document.getElementById('extra-error').appendChild(block);
        }
    </script>
</body>
</html>
