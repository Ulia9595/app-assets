<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пароль изменен | Game Auth</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="page-container">
        <div class="card-custom card-success">

            <div class="header header-success">
                <div class="header-icon">
                    <i class="fas fa-check text-white"></i>
                </div>
                <h1 class="h3 mb-0 fw-bold">Успешно!</h1>
            </div>

            <div class="body">
                <h2 class="title-success">Пароль успешно изменен</h2>

                <p class="message">Ваш пароль был обновлен. Теперь вы можете использовать новый пароль</p>

                <div class="info-box success">
                    <h4>Рекомендации по безопасности</h4>

                    <div class="tip-item">
                        <div class="tip-icon success"><i class="fas fa-check-circle"></i></div>
                        <div class="tip-text">Используйте уникальный пароль</div>
                    </div>

                    <div class="tip-item">
                        <div class="tip-icon success"><i class="fas fa-check-circle"></i></div>
                        <div class="tip-text">Обновляйте пароль каждые 3–6 месяцев</div>
                    </div>

                    <div class="tip-item">
                        <div class="tip-icon success"><i class="fas fa-check-circle"></i></div>
                        <div class="tip-text">Не передавайте пароль другим</div>
                    </div>

                    <div class="tip-item">
                        <div class="tip-icon success"><i class="fas fa-check-circle"></i></div>
                        <div class="tip-text">Используйте 2FA</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
