<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля | Game Auth</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/reset-password.css">
</head>
<body>
    <div class="container">
        <div class="reset-card">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-key"></i>
                </div>
                <div class="logo-text">
                    <h1>Game Auth</h1>
                    <p>Безопасная аутентификация</p>
                </div>
            </div>
            <div id="formContent"></div>
        </div>
    </div>

    <script>
        function getTokenFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }
        const SPECIAL_CHARS = "!@#$%^&*+=";

        function checkPasswordRequirements(password) {
            const requirements = {
                length: password.length >= 8,
                upperCase: /[A-ZА-Я]/.test(password),
                digit: /\d/.test(password),
                special: [...password].some(ch => SPECIAL_CHARS.includes(ch))
            };

            const metCount = Object.values(requirements).filter(v => v).length;

            let strengthText = 'Пустой';
            let strengthPercent = 0;
            let strengthColor = '#6c757d';

            if (password.length > 0 && metCount <= 1) {
                strengthText = 'Слабый';
                strengthPercent = 33;
                strengthColor = '#dc3545';
            } else if (metCount === 2 || metCount === 3) {
                strengthText = 'Средний';
                strengthPercent = 66;
                strengthColor = '#ffc107';
            } else if (metCount === 4) {
                strengthText = 'Сильный';
                strengthPercent = 100;
                strengthColor = '#198754';
            }

            return {
                requirements,
                strengthText,
                strengthPercent,
                strengthColor,
                isValid: metCount === 4
            };
        }

        function updateRequirement(id, isMet) {
            const item = document.getElementById(id);
            if (!item) return;

            const icon = item.querySelector('.requirement-icon i');

            item.classList.toggle('met', isMet);
            icon.className = isMet ? 'fas fa-check' : 'fas fa-circle';
        }

        function validateForm() {
            const passwordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitBtn');
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            const passwordMatchText = document.getElementById('passwordMatchText');

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const result = checkPasswordRequirements(password);
            updateRequirement('reqLength', result.requirements.length);
            updateRequirement('reqUpperCase', result.requirements.upperCase);
            updateRequirement('reqDigit', result.requirements.digit);
            updateRequirement('reqSpecial', result.requirements.special);

            strengthFill.style.width = result.strengthPercent + '%';
            strengthFill.style.backgroundColor = result.strengthColor;
            strengthText.textContent = result.strengthText;
            strengthText.style.color = result.strengthColor;

            const passwordsMatch = password === confirmPassword && confirmPassword.length > 0;

            if (confirmPassword.length === 0) {
                passwordMatchText.textContent = '';
                passwordMatchText.className = 'password-match-text';
            } else if (passwordsMatch) {
                passwordMatchText.textContent = 'Пароли совпадают';
                passwordMatchText.className = 'password-match-text success';
            } else {
                passwordMatchText.textContent = 'Пароли не совпадают';
                passwordMatchText.className = 'password-match-text error';
            }

            submitBtn.disabled = !result.isValid || !passwordsMatch;
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (!input || !icon) return;

            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        }

        function renderForm() {
            const token = getTokenFromURL();
            const formContent = document.getElementById('formContent');

            if (!token) {
                formContent.innerHTML = `
                        <div class="error-state">
                            <div class="error-icon">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <h3 class="error-title">Токен недействителен</h3>
                            <p class="error-text">Ссылка устарела или неверна</p>
                            <div class="error-actions">
                                <button onclick="window.close()" class="error-btn primary">Закрыть</button>
                            </div>
                        </div>
                    `;
                return;
            }

            formContent.innerHTML = `
                <h2 class="page-title">Сброс пароля</h2>
                <p class="page-subtitle">Создайте новый пароль</p>

                <form onsubmit="return handleSubmit(event)">
                    <input type="hidden" id="tokenInput" value="${token}">

                    <div class="form-group">
                        <label class="form-label">Новый пароль</label>
                        <div class="password-input">
                            <input type="password" id="newPassword">
                            <button type="button" class="toggle-password"
                                onclick="togglePasswordVisibility('newPassword', 'newPasswordIcon')">
                                <i id="newPasswordIcon" class="fas fa-eye"></i>
                            </button>
                        </div>

                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-fill" id="strengthFill"></div>
                            </div>
                            <div class="strength-text" id="strengthText">Пустой</div>
                        </div>

                        <div class="requirements">
                            <div class="requirements-title">
                                Требования к паролю
                            </div>

                            <div class="requirements-grid">
                                <div class="requirement-item" id="reqLength">
                                    <span class="requirement-icon"><i class="fas fa-circle"></i></span>
                                    <span class="requirement-text">Минимум 8 символов</span>
                                </div>

                                <div class="requirement-item" id="reqUpperCase">
                                    <span class="requirement-icon"><i class="fas fa-circle"></i></span>
                                    <span class="requirement-text">Заглавная буква</span>
                                </div>

                                <div class="requirement-item" id="reqDigit">
                                    <span class="requirement-icon"><i class="fas fa-circle"></i></span>
                                    <span class="requirement-text">Цифра</span>
                                </div>

                                <div class="requirement-item" id="reqSpecial">
                                    <span class="requirement-icon"><i class="fas fa-circle"></i></span>
                                    <span class="requirement-text">Спецсимвол: ${SPECIAL_CHARS}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group confirm-password-group">
                        <label class="form-label">Повторите пароль</label>
                        <div class="password-input">
                            <input type="password" id="confirmPassword">
                            <button type="button" class="toggle-password"
                                onclick="togglePasswordVisibility('confirmPassword', 'confirmPasswordIcon')">
                                <i id="confirmPasswordIcon" class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-match-text" id="passwordMatchText"></div>
                    </div>

                    <button class="submit-btn" id="submitBtn" disabled>
                        Установить пароль
                    </button>
                </form>
            `;

            document.getElementById('newPassword').addEventListener('input', validateForm);
            document.getElementById('confirmPassword').addEventListener('input', validateForm);
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const token = document.getElementById('tokenInput').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Сохраняем...';

            try {
                const response = await fetch('/api/Auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });

                const result = await response.json();

                if (response.ok && result.success === true) {
                    window.location.href = result.redirectUrl || '/static/reset-success.html';
                } else {
                    const message = result.error || 'Не удалось изменить пароль';
                    window.location.href = `/static/reset-invalid.html?message=${encodeURIComponent(message)}`;
                }
            } catch (e) {
                alert('Ошибка подключения к серверу');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Установить пароль';
            }

            return false;
        }

        document.addEventListener('DOMContentLoaded', renderForm);
    </script>
</body>
</html>
