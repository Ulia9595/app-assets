<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля | Game Auth</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .reset-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 60px;
            min-height: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .logo-icon i {
                font-size: 24px;
                color: white;
            }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
        }

        .logo-text p {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .form-label i {
                color: #6366f1;
            }

        .password-input {
            position: relative;
        }

            .password-input input {
                width: 100%;
                padding: 16px 52px 16px 16px;
                border: 2px solid #e5e7eb;
                border-radius: 12px;
                font-size: 16px;
                transition: all 0.3s ease;
            }

                .password-input input:focus {
                    outline: none;
                    border-color: #6366f1;
                    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
                }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }

            .toggle-password:hover {
                color: #6366f1;
            }

        .password-strength {
            margin-top: 8px;
        }

        .strength-bar {
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .strength-text {
            font-size: 14px;
            font-weight: 600;
        }

        .requirements {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .requirements-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .requirements-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .requirement-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .requirement-icon i {
                font-size: 10px;
            }

        .requirement-text {
            font-size: 14px;
            color: #6b7280;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

            .submit-btn:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
            }

            .submit-btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

            .back-link a {
                color: #6366f1;
                text-decoration: none;
                font-size: 14px;
                font-weight: 500;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

                .back-link a:hover {
                    text-decoration: underline;
                }

        .error-state {
            text-align: center;
            padding: 40px;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

            .error-icon i {
                font-size: 32px;
                color: white;
            }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #dc2626;
            margin-bottom: 12px;
        }

        .error-text {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .error-btn {
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

            .error-btn.primary {
                background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
                color: white;
            }

                .error-btn.primary:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
                }

            .error-btn.secondary {
                background: white;
                color: #374151;
                border: 2px solid #e5e7eb;
            }

                .error-btn.secondary:hover {
                    background: #f9fafb;
                }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @media (max-width: 992px) {
            .reset-card {
                padding: 40px;
            }

            .requirements-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 576px) {
            .reset-card {
                padding: 30px 20px;
            }

            .page-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reset-card">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-key"></i>
                </div>
                <div class="logo-text">
                    <h1>Game Auth</h1>
                    <p>Безопасная аутентификация</p>
                </div>
            </div>

            <div id="formContent">
            </div>
        </div>
    </div>

    <script>
        function getTokenFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }

        function checkPasswordRequirements(password) {
            const requirements = {
                length: password.length >= 8,
                upperCase: /[A-Z]/.test(password),
                digit: /\d/.test(password),
                special: /[!@#$%^&*]/.test(password)
            };

            const metCount = Object.values(requirements).filter(v => v).length;

            let strength = 'empty';
            let strengthPercent = 0;
            let strengthColor = '#e5e7eb';
            let strengthText = 'Пустой';

            if (password.length === 0) {
                strength = 'empty';
                strengthPercent = 0;
                strengthColor = '#e5e7eb';
                strengthText = 'Пустой';
            } else if (metCount <= 1) {
                strength = 'weak';
                strengthPercent = 25;
                strengthColor = '#ef4444';
                strengthText = 'Слабый';
            } else if (metCount === 2) {
                strength = 'medium';
                strengthPercent = 50;
                strengthColor = '#f59e0b';
                strengthText = 'Средний';
            } else if (metCount === 3) {
                strength = 'good';
                strengthPercent = 75;
                strengthColor = '#10b981';
                strengthText = 'Хороший';
            } else {
                strength = 'strong';
                strengthPercent = 100;
                strengthColor = '#3b82f6';
                strengthText = 'Надежный';
            }

            return {
                requirements: requirements,
                metCount: metCount,
                strength: strength,
                strengthPercent: strengthPercent,
                strengthColor: strengthColor,
                strengthText: strengthText,
                isValid: requirements.length && requirements.upperCase && requirements.digit && requirements.special
            };
        }

        function updatePasswordUI() {
            const password = document.getElementById('newPassword').value;
            const validation = checkPasswordRequirements(password);

            const requirementIcons = {
                length: document.getElementById('reqLengthIcon'),
                upperCase: document.getElementById('reqUpperIcon'),
                digit: document.getElementById('reqDigitIcon'),
                special: document.getElementById('reqSpecialIcon')
            };

            Object.keys(requirementIcons).forEach(key => {
                if (requirementIcons[key]) {
                    const icon = requirementIcons[key];
                    icon.className = validation.requirements[key]
                        ? 'fas fa-check'
                        : 'fas fa-times';
                    icon.style.color = validation.requirements[key] ? '#10b981' : '#ef4444';
                }
            });

            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');

            if (strengthFill) {
                strengthFill.style.width = validation.strengthPercent + '%';
                strengthFill.style.backgroundColor = validation.strengthColor;
            }

            if (strengthText) {
                strengthText.textContent = validation.strengthText;
                strengthText.style.color = validation.strengthColor;
            }

            checkPasswordMatch();

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                const passwordMatch = document.getElementById('passwordMatch').style.display !== 'none';
                submitBtn.disabled = !(validation.isValid && passwordMatch);
            }
        }

        function checkPasswordMatch() {
            const password1 = document.getElementById('newPassword').value;
            const password2 = document.getElementById('confirmPassword').value;
            const matchDiv = document.getElementById('passwordMatch');
            const mismatchDiv = document.getElementById('passwordMismatch');

            matchDiv.style.display = 'none';
            mismatchDiv.style.display = 'none';

            if (password2.length === 0) {
                return false;
            }

            if (password1 === password2) {
                matchDiv.style.display = 'block';
                return true;
            } else {
                mismatchDiv.style.display = 'block';
                return false;
            }
        }

        function togglePasswordVisibility(buttonId, inputId) {
            const button = document.getElementById(buttonId);
            const input = document.getElementById(inputId);

            button.addEventListener('click', function () {
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        }

        function closePage() {
            document.body.style.animation = 'fadeOut 0.5s ease forwards';

            setTimeout(() => {
                if (window.opener) {
                    window.close();
                } else if (window.history.length > 1) {
                    window.history.back();
                } else {
                    showFinalMessage();
                }
            }, 500);
        }

        function handleSubmit(event) {
            event.preventDefault();

            const password = document.getElementById('newPassword').value;
            const validation = checkPasswordRequirements(password);

            if (!validation.isValid) {
                alert('Пожалуйста, выполните все требования к паролю.');
                return false;
            }

            if (!checkPasswordMatch()) {
                alert('Пароли не совпадают. Пожалуйста, проверьте введенные данные.');
                return false;
            }

            const token = document.getElementById('tokenInput').value;
            const newPassword = password;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Обновление пароля...';

            fetch('/api/Auth/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    token: token,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                }),
                credentials: 'include'
            })
                .then(response => {
                    console.log('Response status:', response.status);

                    if (!response.ok) {
                        return response.text().then(text => {
                            throw new Error(`HTTP ${response.status}: ${text}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Response data:', data);

                    if (data.success) {
                        if (data.redirectUrl) {
                            window.location.href = data.redirectUrl;
                        } else {
                            alert('Пароль успешно изменен! Теперь вы можете войти с новым паролем.');
                            setTimeout(() => {
                                closePage();
                            }, 1500);
                        }
                    } else {
                        if (data.redirectUrl) {
                            window.location.href = data.redirectUrl;
                        } else {
                            alert('Ошибка: ' + (data.error || 'Не удалось сбросить пароль'));
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-key"></i> Установить новый пароль';
                        }
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);

                    if (error.message.includes('Failed to fetch')) {
                        alert('Не удалось подключиться к серверу. Пожалуйста:\n\n' +
                            '1. Убедитесь, что сервер запущен\n' +
                            '2. Проверьте соединение с интернетом\n' +
                            '3. Попробуйте обновить страницу');
                    } else if (error.message.includes('401') || error.message.includes('403')) {
                        alert('Ошибка авторизации. Токен недействителен или истек срок действия.');
                    } else if (error.message.includes('500')) {
                        alert('Внутренняя ошибка сервера. Попробуйте позже.');
                    } else {
                        alert('Ошибка подключения: ' + error.message);
                    }

                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-key"></i> Установить новый пароль';
                });

            return false;
        }

        function renderForm() {
            const token = getTokenFromURL();
            const formContent = document.getElementById('formContent');

            if (token) {
                formContent.innerHTML = `
                        <h2 class="page-title">Сброс пароля</h2>
                        <p class="page-subtitle">Создайте новый безопасный пароль для вашего аккаунта</p>

                        <div class="alert alert-success d-flex align-items-center mb-4" style="background: #d1fae5; border: none; border-radius: 12px; padding: 16px;">
                            <i class="fas fa-check-circle text-success me-3" style="font-size: 20px;"></i>
                            <div>
                                <h6 class="mb-1 fw-bold" style="color: #065f46;">Токен активен</h6>
                                <small style="color: #047857;">Действителен в течение 15 минут</small>
                            </div>
                        </div>

                        <form id="resetForm" onsubmit="return handleSubmit(event)">
                            <input type="hidden" id="tokenInput" value="${token}">

                            <!-- Новый пароль -->
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="fas fa-lock"></i>Новый пароль
                                </label>
                                <div class="password-input">
                                    <input type="password"
                                           id="newPassword"
                                           placeholder="Придумайте надежный пароль"
                                           minlength="8"
                                           required>
                                    <button type="button" class="toggle-password" id="togglePassword1">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>

                                <div class="password-strength">
                                    <div class="strength-bar">
                                        <div class="strength-fill" id="strengthFill"></div>
                                    </div>
                                    <div class="strength-text" id="strengthText">Пустой</div>
                                </div>
                            </div>

                            <!-- Требования -->
                            <div class="requirements">
                                <h6 class="requirements-title">
                                    <i class="fas fa-list-check"></i>Требования безопасности
                                </h6>
                                <div class="requirements-grid">
                                    <div class="requirement-item">
                                        <div class="requirement-icon">
                                            <i class="fas fa-times" id="reqLengthIcon"></i>
                                        </div>
                                        <span class="requirement-text">Минимум 8 символов</span>
                                    </div>
                                    <div class="requirement-item">
                                        <div class="requirement-icon">
                                            <i class="fas fa-times" id="reqUpperIcon"></i>
                                        </div>
                                        <span class="requirement-text">Заглавная и строчная латинская буква</span>
                                    </div>
                                    <div class="requirement-item">
                                        <div class="requirement-icon">
                                            <i class="fas fa-times" id="reqDigitIcon"></i>
                                        </div>
                                        <span class="requirement-text">Хотя бы одна цифра</span>
                                    </div>
                                    <div class="requirement-item">
                                        <div class="requirement-icon">
                                            <i class="fas fa-times" id="reqSpecialIcon"></i>
                                        </div>
                                        <span class="requirement-text">Специальный символ</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Подтверждение пароля -->
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="fas fa-lock"></i>Подтверждение пароля
                                </label>
                                <div class="password-input">
                                    <input type="password"
                                           id="confirmPassword"
                                           placeholder="Повторите пароль"
                                           minlength="8"
                                           required>
                                    <button type="button" class="toggle-password" id="togglePassword2">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>

                                <div id="passwordMatch" style="display: none; margin-top: 8px;">
                                    <div style="color: #10b981; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                                        <i class="fas fa-check-circle"></i>
                                        <span>Пароли совпадают</span>
                                    </div>
                                </div>

                                <div id="passwordMismatch" style="display: none; margin-top: 8px;">
                                    <div style="color: #ef4444; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                                        <i class="fas fa-times-circle"></i>
                                        <span>Пароли не совпадают</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Кнопка отправки -->
                            <button type="submit" class="submit-btn" id="submitBtn" disabled>
                                <i class="fas fa-key"></i>
                                Установить новый пароль
                            </button>
                        </form>

                        <div class="back-link">
                            <button onclick="closePage()" class="btn btn-link" style="color: #6366f1; text-decoration: none;">
                                <i class="fas fa-times me-2"></i>
                                Закрыть страницу
                            </button>
                        </div>
                    `;

                setTimeout(() => {
                    togglePasswordVisibility('togglePassword1', 'newPassword');
                    togglePasswordVisibility('togglePassword2', 'confirmPassword');

                    document.getElementById('newPassword').addEventListener('input', updatePasswordUI);
                    document.getElementById('confirmPassword').addEventListener('input', updatePasswordUI);

                    updatePasswordUI();
                }, 100);

            } else {
                formContent.innerHTML = `
                        <div class="error-state">
                            <div class="error-icon">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <h3 class="error-title">Токен недействителен</h3>
                            <p class="error-text">Ссылка для сброса пароля устарела или неверна.</p>

                            <div class="error-actions">
                                <button onclick="closePage()" class="error-btn primary">
                                    <i class="fas fa-times me-2"></i>
                                    Закрыть страницу
                                </button>
                                <button onclick="showContactSupport()" class="error-btn secondary">
                                    <i class="fas fa-question-circle me-2"></i>
                                    Связаться с поддержкой
                                </button>
                            </div>
                        </div>
                    `;
            }
        }

        function showContactSupport() {
            const email = 'support@example.com';
            alert(`Для получения помощи свяжитесь с поддержкой по email: ${email}`);
        }

        function showFinalMessage() {
            document.body.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); padding: 20px;">
                        <div class="text-center">
                            <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                                <i class="fas fa-check text-white" style="font-size: 24px;"></i>
                            </div>
                            <h3 style="color: #6366f1; margin-bottom: 10px;">Готово!</h3>
                            <p style="color: #666; margin-bottom: 20px;">Вы можете безопасно закрыть эту вкладку</p>
                            <button onclick="closePage()" class="btn btn-primary" style="margin-top: 10px;">
                                <i class="fas fa-times me-2"></i>
                                Закрыть вкладку
                            </button>
                        </div>
                    </div>
                `;
        }

        document.addEventListener('DOMContentLoaded', renderForm);

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closePage();
            }
        });
    </script>
</body>
</html>
